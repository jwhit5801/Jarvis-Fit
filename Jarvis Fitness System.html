<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>JARVIS Fit · Mark I</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b1220;color:#edf3fc}*{box-sizing:border-box}body{margin:0;padding:18px 15px 100px;max-width:650px;margin:auto}h1{font-size:25px;margin:0}h2{font-size:17px;margin:0 0 10px}.sub{color:#9bacbf;font-size:13px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.tag{font-size:11px;color:#7ce9d1;border:1px solid #20675d;padding:5px 8px;border-radius:20px}.card{background:#151f30;border:1px solid #29374b;border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#aab8ca}.small{font-size:12px}.btn{background:#44cbb1;color:#06151a;border:0;padding:12px 15px;border-radius:10px;font-weight:750;cursor:pointer}.secondary{background:#26364b;color:#e9f1ff}.danger{background:#493039;color:#ffd9df}.btn:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#101b2b;border-radius:10px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}select,input{background:#0b1625;color:#fff;border:1px solid #3a4c65;border-radius:9px;padding:10px;font:inherit;min-width:0}select{width:100%}input[type=number]{width:76px}input[type=checkbox]{width:20px;height:20px;accent-color:#44cbb1}.sets{width:100%;border-collapse:collapse;margin-top:12px}.sets th,.sets td{padding:7px 3px;text-align:center;font-size:12px}.sets th{color:#9bacbf}.sets td input{width:100%;max-width:85px;text-align:center}.sets td:first-child{width:40px}.exercise{border-top:1px solid #334057;padding:16px 0 4px}.exercise:first-child{border-top:0}.pill{display:inline-block;background:#22384a;border-radius:6px;padding:4px 7px;color:#b5d9ec;font-size:11px;margin:4px 4px 4px 0}.notice{border-left:3px solid #e2a75d;padding:10px;background:#30271f;font-size:12px;color:#f1d9b7;border-radius:6px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0d1726;border-top:1px solid #30415a;padding:12px 15px env(safe-area-inset-bottom);display:flex;gap:8px;justify-content:center}.bottom button{flex:1;max-width:210px}.hidden{display:none}.warm{padding:8px 0;border-bottom:1px solid #2c3c4f;font-size:13px}.badge{font-size:11px;color:#83e5cf}button{touch-action:manipulation}</style></head><body><div class="head"><div><div class="sub">JARVIS / FITNESS SYSTEM</div><h1>JARVIS Fit <span style="color:#44cbb1">Mark I</span></h1></div><span class="tag">LOCAL · OFFLINE</span></div><div id="dashboard"></div><div id="workout"></div><div id="history" class="hidden"></div><div id="settings" class="hidden"></div><div class="bottom"><button class="btn secondary" onclick="tab('workout')">Train</button><button class="btn secondary" onclick="tab('history')">History</button><button class="btn secondary" onclick="tab('settings')">Settings</button></div><script>
const PLAN=[{name:'Push A',focus:'Chest emphasis',ex:[['Barbell bench press',3,'5–8','Controlled · 1–2 RIR','compound'],['Incline Smith press',3,'8–10','2–3s eccentric','compound'],['Cable lateral raise',3,'12–20','Slow and strict','isolation'],['Rope triceps pushdown',3,'10–15','Squeeze','isolation'],['Pec deck',3,'12–15','Short-rest pump finisher','isolation']]},{name:'Pull A',focus:'Lat width',ex:[['Weighted pull-ups',3,'6–8','Controlled · weight is added load','compound'],['Chest-supported row',3,'8–12','Full controlled range','compound'],['Single-arm cable lat row',3,'10–12','Slow eccentric · per arm','isolation'],['Reverse pec deck',3,'12–20','Superset with incline curls','isolation'],['Incline dumbbell curl',3,'8–12','Superset with reverse pec deck','isolation'],['Cable curl',2,'12–15','Short-rest finisher','isolation']]},{name:'Legs A',focus:'Quad emphasis',ex:[['Hack squat',3,'6–10','Controlled','compound'],['Leg press',3,'10–12','Quad-biased','compound'],['Leg extension',3,'12–15','Slow · squeeze','isolation'],['Seated leg curl',3,'10–15','Slow eccentric','isolation'],['Standing calf raise',4,'10–15','Full controlled range','isolation'],['Cable crunch',3,'10–15','Controlled','isolation']]},{name:'Push B',focus:'Shoulder emphasis',ex:[['Machine shoulder press',3,'8–12','Controlled','compound'],['Incline machine chest press',3,'8–12','Controlled','compound'],['Cable lateral raise',4,'12–20','Pump finisher','isolation'],['Cable chest fly',3,'12–15','Slow · comfortable range','isolation'],['Overhead cable triceps extension',3,'10–15','Superset with pushdowns','isolation'],['Single-arm pushdown',2,'12–15','Superset with extensions','isolation']]},{name:'Pull B',focus:'Back thickness',ex:[['Chest-supported upper-back row',3,'8–10','Controlled','compound'],['Neutral-grip lat pulldown',3,'10–12','Controlled','compound'],['Straight-arm cable pulldown',2,'12–15','Slow','isolation'],['Rear-delt cable fly',3,'12–20','Slow','isolation'],['Preacher curl',3,'10–15','Controlled','isolation'],['Hammer curl',2,'10–15','Controlled','isolation']]},{name:'Legs B',focus:'Posterior chain',ex:[['Romanian deadlift',3,'6–10','2–3s eccentric','compound'],['Lying leg curl',3,'10–12','Slow','isolation'],['Bulgarian split squat',3,'8–12','Per leg · controlled','compound'],['Seated calf raise',4,'12–20','Stretch and squeeze','isolation'],['Hanging knee raise',3,'10–15','Controlled','isolation']]}];
const KEY='jarvis-fit-mark1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=state||{index:0,weights:{},logs:[],draft:{},rest:90};let currentTab='workout';function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function round5(n){return Math.max(5,Math.round(n/5)*5)}function key(i,j){return i+':'+j}function getDraft(i,j,n){let k=key(i,j);if(!state.draft[k])state.draft[k]=Array.from({length:n},()=>({w:'',r:'',done:false}));return state.draft[k]}function latest(name){for(let i=state.logs.length-1;i>=0;i--){let e=state.logs[i].ex.find(x=>x.name===name);if(e)return e}return null}function tab(t){currentTab=t;for(let id of ['workout','history','settings'])document.getElementById(id).classList.toggle('hidden',id!==t);render()}
function render(){let p=PLAN[state.index];document.getElementById('dashboard').innerHTML=`<div class="card"><div class="sub">UP NEXT · SESSION ${state.index+1} OF 6</div><div class="row"><div><h2 style="font-size:24px;margin:6px 0">${p.name}</h2><div class="muted small">${p.focus}</div></div><div class="stat"><span class="sub">Completed</span><b>${state.logs.length}</b></div></div><div style="margin-top:12px" class="sub">Rotation advances only when you finish a session. Rest days do not skip workouts.</div></div>`;let out=`<div class="notice">If sternum pain, pain with breathing, or shoulder pain persists, seek medical assessment before pressing. Do not train through chest pain.</div><div class="card"><div class="row"><h2>Today's workout</h2><button class="btn secondary" onclick="skip()">Choose session</button></div><div class="small muted">Working sets exclude warm-ups. Log the actual weight and reps for each set. Weights are in lb.</div>`;p.ex.forEach((e,j)=>{let k=key(state.index,j),d=getDraft(state.index,j,e[1]),last=latest(e[0]);let w=state.weights[e[0]]??(last?Number(last.sets.find(s=>Number(s.w)>0)?.w||0):0);out+=`<div class="exercise"><div class="row"><b>${esc(e[0])}</b><span class="badge">${e[1]} × ${e[2]}</span></div><div class="sub" style="margin-top:5px">${esc(e[3])}</div><div class="row" style="margin-top:12px"><label class="small muted">Target working weight (lb)</label><input type="number" min="0" step="2.5" value="${w||''}" placeholder="lb" onchange="weightChange(${j},this.value)"></div><div id="warm${j}">${warmHtml(e,w)}</div><table class="sets"><thead><tr><th>Set</th><th>Weight</th><th>Reps</th><th>Done</th></tr></thead><tbody>`;d.forEach((s,z)=>out+=`<tr><td>${z+1}</td><td><input aria-label="Weight set ${z+1}" type="number" min="0" step="0.5" value="${esc(s.w)}" onchange="update(${j},${z},'w',this.value)"></td><td><input aria-label="Reps set ${z+1}" type="number" min="0" step="1" value="${esc(s.r)}" onchange="update(${j},${z},'r',this.value)"></td><td><input type="checkbox" ${s.done?'checked':''} onchange="update(${j},${z},'done',this.checked)"></td></tr>`);out+=`</tbody></table><button class="btn secondary small" onclick="addSet(${j})">+ Add set</button>`;if(last)out+=`<div class="sub" style="margin-top:9px">Previous: ${last.sets.filter(s=>s.done).map(s=>`${s.w}×${s.r}`).join(' · ')||'No completed sets'}</div>`;out+='</div>'});out+=`<div class="row" style="margin-top:15px"><button class="btn secondary" onclick="startRest()">Start rest timer</button><span id="timer" class="muted">${state.rest}s rest</span></div><button style="width:100%;margin-top:15px" class="btn" onclick="finish()">Finish & save workout →</button></div>`;document.getElementById('workout').innerHTML=out;document.getElementById('history').innerHTML=`<div class="card"><h2>Workout history</h2>${state.logs.length?state.logs.slice().reverse().map((l,i)=>`<div class="warm"><b>${esc(l.name)}</b> <span class="sub">${new Date(l.date).toLocaleString()}</span><div class="sub">${l.ex.filter(e=>e.sets.some(s=>s.done)).map(e=>esc(e.name)).join(' · ')}</div></div>`).join(''):'<p class="muted">Complete your first workout to see your history.</p>'}</div>`;document.getElementById('settings').innerHTML=`<div class="card"><h2>Settings & backup</h2><p class="sub">Data is saved in this browser on this device. Clearing browser storage may erase it. Export backups regularly; there is no automatic cross-device sync.</p><div class="row"><label>Rest timer</label><select style="width:135px" onchange="state.rest=Number(this.value);save();render()">${[45,60,90,120,180].map(x=>`<option value="${x}" ${state.rest===x?'selected':''}>${x} seconds</option>`).join('')}</select></div><div class="row" style="margin-top:15px"><button class="btn" onclick="exportData()">Export backup</button><label class="btn secondary" style="cursor:pointer">Import backup<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div><button class="btn danger" style="margin-top:16px" onclick="resetAll()">Erase all data</button></div>`;save()}
function warmHtml(e,w){if(!w||w<=0)return '<div class="sub" style="margin-top:9px">Enter a working weight for suggested warm-ups.</div>';if(e[4]!=='compound')return '<div class="sub" style="margin-top:9px">Isolation: 1–2 light feeler sets as needed.</div>';return `<div class="sub" style="margin-top:9px">Suggested warm-up (adjust for comfort): ${[[.4,10],[.6,6],[.75,3],[.9,1]].map(([pct,r])=>round5(w*pct)+'×'+r).join(' · ')}</div>`}function weightChange(j,v){let name=PLAN[state.index].ex[j][0];state.weights[name]=Number(v)||0;document.getElementById('warm'+j).innerHTML=warmHtml(PLAN[state.index].ex[j],Number(v));save()}function update(j,z,field,v){getDraft(state.index,j,PLAN[state.index].ex[j][1])[z][field]=v;save()}function addSet(j){getDraft(state.index,j,PLAN[state.index].ex[j][1]).push({w:'',r:'',done:false});save();render()}function finish(){let p=PLAN[state.index],ex=p.ex.map((e,j)=>({name:e[0],sets:getDraft(state.index,j,e[1]).map(s=>({...s}))}));let count=ex.reduce((n,e)=>n+e.sets.filter(s=>s.done&&Number(s.r)>0).length,0);if(!count){alert('Mark at least one completed set with reps before saving.');return}if(!confirm('Save '+count+' completed sets and advance to the next workout?'))return;state.logs.push({date:new Date().toISOString(),name:p.name,ex});for(let j=0;j<p.ex.length;j++)delete state.draft[key(state.index,j)];state.index=(state.index+1)%PLAN.length;save();render();window.scrollTo(0,0)}function skip(){let s=prompt('Choose session 1–6:\n'+PLAN.map((p,i)=>(i+1)+'. '+p.name).join('\n'),state.index+1);if(s!==null&&Number(s)>=1&&Number(s)<=6){state.index=Number(s)-1;save();render()}}let restInterval=null;function startRest(){if(restInterval)clearInterval(restInterval);let end=Date.now()+state.rest*1000;function tick(){let left=Math.max(0,Math.ceil((end-Date.now())/1000)),el=document.getElementById('timer');if(el)el.textContent=left?left+'s remaining':'Rest complete';if(!left)clearInterval(restInterval)}tick();restInterval=setInterval(tick,250)}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='jarvis-fit-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function importData(el){let f=el.files[0];if(!f)return;f.text().then(t=>{try{let v=JSON.parse(t);if(!Array.isArray(v.logs)||!Number.isInteger(v.index)||v.index<0||v.index>5)throw Error();if(confirm('Replace current workout data with this backup?')){state=v;save();render()}}catch{alert('Invalid backup file')}})}function resetAll(){if(confirm('Permanently erase all workout data on this device?')){localStorage.removeItem(KEY);location.reload()}}render();
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>JARVIS Fit · Mark I</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b1220;color:#edf3fc}*{box-sizing:border-box}body{margin:0 auto;padding:18px 15px 110px;max-width:650px}h1{font-size:25px;margin:0}h2{font-size:17px;margin:0 0 10px}.sub{color:#9bacbf;font-size:13px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.head{margin-bottom:20px}.tag{font-size:11px;color:#7ce9d1;border:1px solid #20675d;padding:5px 8px;border-radius:20px}.card{background:#151f30;border:1px solid #29374b;border-radius:16px;padding:16px;margin:12px 0}.muted{color:#aab8ca}.small{font-size:12px}.btn{background:#44cbb1;color:#06151a;border:0;padding:12px 15px;border-radius:10px;font-weight:750;cursor:pointer}.secondary{background:#26364b;color:#e9f1ff}.danger{background:#493039;color:#ffd9df}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#101b2b;border-radius:10px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}select,input{background:#0b1625;color:#fff;border:1px solid #3a4c65;border-radius:9px;padding:10px;font:inherit;min-width:0}select{width:100%}input[type=number]{width:76px}input[type=checkbox]{width:20px;height:20px;accent-color:#44cbb1}.sets{width:100%;border-collapse:collapse;margin-top:12px}.sets th,.sets td{padding:7px 3px;text-align:center;font-size:12px}.sets th{color:#9bacbf}.sets td input{width:100%;max-width:85px;text-align:center}.sets td:first-child{width:40px}.exercise{border-top:1px solid #334057;padding:16px 0 4px}.exercise:first-child{border-top:0}.notice{border-left:3px solid #e2a75d;padding:10px;background:#30271f;font-size:12px;color:#f1d9b7;border-radius:6px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0d1726;border-top:1px solid #30415a;padding:12px 15px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}.bottom button{flex:1;max-width:210px}.hidden{display:none}.warm{padding:8px 0;border-bottom:1px solid #2c3c4f;font-size:13px}.badge{font-size:11px;color:#83e5cf}button{touch-action:manipulation}.selector{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.session{padding:12px 5px;border-radius:10px;border:1px solid #3a4c65;background:#101b2b;color:#e9f1ff;font-weight:700;font-size:13px}.session.active{background:#174a48;border:2px solid #44cbb1;color:#a8ffeb}.session small{display:block;font-size:10px;font-weight:400;color:#aab8ca;margin-top:3px}.selection-note{font-size:12px;color:#9bacbf;margin:6px 0 0}
.card p.sub{line-height:1.55}.exercise .badge{white-space:nowrap}.exercise b{line-height:1.35}</style></head><body>
<div class="head"><div><div class="sub">JARVIS / FITNESS SYSTEM</div><h1>JARVIS Fit <span style="color:#44cbb1">Mark I</span></h1></div><span class="tag">LOCAL STORAGE</span></div>
<div id="dashboard"></div><div id="workout"></div><div id="history" class="hidden"></div><div id="settings" class="hidden"></div>
<div class="bottom"><button class="btn secondary" onclick="tab('workout')">Train</button><button class="btn secondary" onclick="tab('history')">History</button><button class="btn secondary" onclick="tab('settings')">Settings</button></div>
<script>
const PLAN=[{"name":"Push A","focus":"Chest strength and triceps","warm":"5 min easy cardio, comfortable shoulder mobility. Bench ramp-up: empty bar ×12, then approximately 40% ×8, 60% ×5, 80% ×3, 90% ×1. Adjust to current pain-free capacity.","notes":["Incline Smith: one light set of 8, then one moderate set of 4–5.","Pec deck: four controlled short-rest sets; avoid aggressive stretching and skip if sternum symptoms occur."],"ex":[["Barbell bench press",3,"5–8","H","compound",180,"H"],["Incline Smith press",3,"8–10","H","compound",120,"H"],["Cable lateral raise",4,"12–20","S","isolation",60,"S"],["Rope triceps pushdown",4,"10–15","S","isolation",60,"S"],["Overhead cable triceps extension",2,"10–15","S","isolation",75,"S"],["Pec deck",4,"12–15","30–45 sec rest · FST-4","isolation",40,"FST-4"]]},{"name":"Pull A","focus":"Lat width and biceps","warm":"5 min easy cardio, scapular pull-ups. Pull-up preparation: assisted/bodyweight ×6–8, bodyweight ×3–5, optional +10 lb ×1–2.","notes":["Superset reverse pec deck → incline dumbbell curl for three rounds; finish the fourth reverse pec deck set separately. Rest 90 sec after each pair.","Chest-supported row: one light ×10 and one moderate ×5 warm-up.","Pull elbows toward hips on lat rows; control incline-curl stretch."],"ex":[["Weighted pull-ups",3,"5–8","Weight is added load · H","compound",180,"H"],["Chest-supported row",3,"8–12","H","compound",120,"H"],["Single-arm cable lat row",3,"10–12","S","isolation",75,"S"],["Reverse pec deck",4,"12–20","Pair with incline DB curl · SS, S","isolation",0,"SS, S"],["Incline dumbbell curl",3,"8–12","90 sec after pair · SS, S","isolation",90,"SS, S"],["Cable curl",3,"12–15","S","isolation",60,"S"]]},{"name":"Legs A","focus":"Quad specialization","warm":"5 min easy cardio. Hack squat: empty sled/light ×10–12, then approximately 40% ×8, 60% ×5, 80% ×2–3.","notes":["Pre-exhaust: leg extension → leg press for three rounds, then rest 2 min after each pair. Hack squats are completed first.","Use a comfortable range of motion and controlled lowering."],"ex":[["Hack squat",4,"6–10","H","compound",180,"H"],["Leg extension",3,"12–15","Immediately before leg press · PE, S","isolation",0,"PE, S"],["Leg press",3,"10–12","2 min after pair · PE","compound",120,"PE"],["Seated leg curl",4,"10–15","S","isolation",75,"S"],["Standing calf raise",4,"10–15","S","isolation",60,"S"],["Seated calf raise",2,"12–20","S","isolation",60,"S"]]},{"name":"Push B","focus":"Chest hypertrophy and maximum pump","warm":"5 min easy cardio. Incline machine press ramp-up: approximately 40% ×10, 60% ×6, 80% ×2–3.","notes":["Flat converging press: one lighter set ×8 before working sets.","FST-4 cable lateral raise: four controlled sets, 30–45 sec rest, shoulders down and no swinging.","Optional superset overhead cable extension → single-arm pushdown for three rounds, rest 75 sec after each pair."],"ex":[["Incline machine chest press",4,"8–12","2–3 min rest · H","compound",150,"H"],["Flat converging chest press",3,"8–12","H","compound",120,"H"],["Machine shoulder press",3,"8–12","H","compound",120,"H"],["Cable chest fly",3,"12–15","S","isolation",60,"S"],["Cable lateral raise",4,"12–20","30–45 sec rest · FST-4","isolation",40,"FST-4"],["Overhead cable triceps extension",3,"10–15","Optional superset with pushdown · S","isolation",75,"S"],["Single-arm cable pushdown",3,"12–15","Optional superset with extension · S","isolation",60,"S"]]},{"name":"Pull B","focus":"Back thickness and arm development","warm":"5 min easy cardio and scapular movement. Chest-supported upper-back row: approximately 45% ×10 and 70% ×5.","notes":["Optional pre-exhaust every other rotation: straight-arm pulldown immediately before neutral-grip pulldown, using lighter loads.","Optional preacher curl drop set after final set: reduce load 20–25% for 6–12 controlled reps; only introduce after two rotations if elbows and recovery feel good.","Rope hammer curls: neutral wrists, steady upper arms, 2–3 sec lowering."],"ex":[["Chest-supported upper-back row",3,"8–10","H","compound",120,"H"],["Neutral-grip lat pulldown",3,"10–12","H","compound",90,"H"],["Straight-arm cable pulldown",2,"12–15","S","isolation",60,"S"],["Rear-delt cable fly",4,"12–20","S","isolation",60,"S"],["Cable lateral raise",2,"15–20","S","isolation",45,"S"],["Preacher curl",4,"10–15","30–45 sec rest · FST-4","isolation",40,"FST-4"],["Rope hammer curl",3,"10–12","S","isolation",60,"S"]]},{"name":"Legs B","focus":"Posterior chain","warm":"5 min easy cardio and hip hinge preparation. Example RDL ramp-up: empty bar ×10, ~50% ×8, ~70% ×5, ~90% ×2; scale to current comfortable working load.","notes":["Bulgarian split squat: prescribed reps are per leg.","Seated calf raise FST-4: four controlled sets with 30–45 sec rest.","Example warm-up loads in the source are illustrative, not prescribed working weights."],"ex":[["Romanian deadlift",3,"6–10","H","compound",180,"H"],["Lying leg curl",4,"10–12","S","isolation",75,"S"],["Bulgarian split squat",3,"8–12/leg","H/S","compound",90,"H/S"],["Leg extension",3,"12–15","S","isolation",60,"S"],["Seated calf raise",4,"12–20","30–45 sec rest · FST-4","isolation",40,"FST-4"]]}];
const KEY='jarvis-fit-mark1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||typeof state!=='object'||!Array.isArray(state.logs))state={index:0,weights:{},logs:[],draft:{},rest:90};if(!Number.isInteger(state.index)||state.index<0||state.index>=PLAN.length)state.index=0;state.weights=state.weights||{};state.draft=state.draft||{};state.rest=state.rest||90;
const LEGACY_NAMES=[['Barbell bench press','Incline Smith press','Cable lateral raise','Rope triceps pushdown','Pec deck'],['Weighted pull-ups','Chest-supported row','Single-arm cable lat row','Reverse pec deck','Incline dumbbell curl','Cable curl'],['Hack squat','Leg press','Leg extension','Seated leg curl','Standing calf raise','Cable crunch'],['Machine shoulder press','Incline machine chest press','Cable lateral raise','Cable chest fly','Overhead cable triceps extension','Single-arm pushdown'],['Chest-supported upper-back row','Neutral-grip lat pulldown','Straight-arm cable pulldown','Rear-delt cable fly','Preacher curl','Hammer curl'],['Romanian deadlift','Lying leg curl','Bulgarian split squat','Seated calf raise','Hanging knee raise']];
function migrateDrafts(){if(state.olympiaV1)return;let old=state.draft||{},next={};LEGACY_NAMES.forEach((names,i)=>names.forEach((name,j)=>{let newJ=PLAN[i].ex.findIndex(e=>e[0]===name);if(newJ>=0&&Array.isArray(old[i+':'+j]))next[i+':'+newJ]=old[i+':'+j]}));state.draft=next;state.olympiaV1=true;}
migrateDrafts();let currentTab='workout';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Could not save data. Check browser storage.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function round5(n){return Math.max(5,Math.round(n/5)*5)}function key(i,j){return i+':'+j}function getDraft(i,j,n){let k=key(i,j);if(!Array.isArray(state.draft[k]))state.draft[k]=Array.from({length:n},()=>({w:'',r:'',done:false}));while(state.draft[k].length<n)state.draft[k].push({w:'',r:'',done:false});return state.draft[k]}function latest(name){const aliases={"Incline Smith press":["Incline Smith machine press"],"Single-arm cable pushdown":["Single-arm pushdown"],"Rope hammer curl":["Hammer curl"],"Incline dumbbell curl":["Incline DB curl"]};for(let i=state.logs.length-1;i>=0;i--){let e=(state.logs[i].ex||[]).find(x=>x.name===name||(aliases[name]||[]).includes(x.name));if(e)return e}return null}
function tab(t){currentTab=t;document.getElementById('dashboard').classList.toggle('hidden',t!=='workout');for(let id of ['workout','history','settings'])document.getElementById(id).classList.toggle('hidden',id!==t);render()}
function chooseSession(i){if(!Number.isInteger(i)||i<0||i>=PLAN.length)return;state.index=i;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){let p=PLAN[state.index];document.getElementById('dashboard').innerHTML=`<div class="card"><div class="sub">SELECT TODAY'S WORKOUT</div><div class="selector">${PLAN.map((x,i)=>`<button type="button" class="session ${i===state.index?'active':''}" aria-pressed="${i===state.index}" onclick="chooseSession(${i})">${esc(x.name)}<small>${esc(x.focus)}</small></button>`).join('')}</div><div class="row"><div><h2 style="font-size:24px;margin:6px 0">${esc(p.name)}</h2><div class="muted small">${esc(p.focus)}</div></div><div class="stat"><span class="sub">Completed</span><b>${state.logs.length}</b></div></div><p class="selection-note">Tap any workout to switch. Your sets are saved separately for each session. Finishing advances to the next workout in the rotation.</p></div>`;
let out=`<div class="notice">If sternum pain, pain with breathing, or shoulder pain persists, seek medical assessment before pressing. Do not train through chest pain.</div><div class="card"><div class="row"><h2>Today's workout</h2><span class="badge">${esc(p.name)}</span></div><div class="small muted">Working sets exclude warm-ups. Log the actual weight and reps for each set. Weights are in lb.</div>`;
out+=`<div class="card"><h2>Warm-up plan</h2><p class="sub">${esc(p.warm)}</p><h2 style="margin-top:12px">Training methods</h2>${p.notes.map(n=>`<p class="sub">• ${esc(n)}</p>`).join('')}<div class="sub">H = heavy compound · S = standard controlled sets · SS = superset · PE = pre-exhaust · FST-4 = four short-rest sets.</div></div>`;
p.ex.forEach((e,j)=>{let d=getDraft(state.index,j,e[1]),last=latest(e[0]);let w=state.weights[e[0]]??(last?Number((last.sets||[]).find(s=>Number(s.w)>0)?.w||0):0);let suggestion=recommend(e,last,w);out+=`<div class="exercise"><div class="row"><b>${esc(e[0])}</b><span class="badge">${e[1]} × ${e[2]}</span></div><div class="sub" style="margin-top:5px">${esc(e[3])} · Rest ${e[5]?e[5]+" sec":"after pair"}</div><div class="sub" style="margin-top:7px;color:#7ce9d1">${esc(suggestion)}</div><div class="row" style="margin-top:12px"><label class="small muted">Planned working weight (lb)</label><input type="number" min="0" step="2.5" value="${w||''}" placeholder="lb" onchange="weightChange(${j},this.value)"></div><div id="warm${j}">${warmHtml(e,w)}</div><table class="sets"><thead><tr><th>Set</th><th>Weight</th><th>Reps</th><th>Done</th></tr></thead><tbody>`;d.forEach((s,z)=>out+=`<tr><td>${z+1}</td><td><input aria-label="Weight set ${z+1}" type="number" min="0" step="0.5" value="${esc(s.w)}" onchange="update(${j},${z},'w',this.value)"></td><td><input aria-label="Reps set ${z+1}" type="number" min="0" step="1" value="${esc(s.r)}" onchange="update(${j},${z},'r',this.value)"></td><td><input type="checkbox" ${s.done?'checked':''} onchange="update(${j},${z},'done',this.checked)"></td></tr>`);out+=`</tbody></table><button class="btn secondary small" onclick="addSet(${j})">+ Add set</button>`;if(last)out+=`<div class="sub" style="margin-top:9px">Previous: ${(last.sets||[]).filter(s=>s.done).map(s=>`${esc(s.w)}×${esc(s.r)}`).join(' · ')||'No completed sets'}</div>`;out+='</div>'});out+=`<div class="row" style="margin-top:15px"><button class="btn secondary" onclick="startRest()">Start rest timer</button><span id="timer" class="muted">${state.rest}s rest</span></div><button style="width:100%;margin-top:15px" class="btn" onclick="finish()">Finish & save workout →</button></div>`;document.getElementById('workout').innerHTML=out;
document.getElementById('history').innerHTML=`<div class="card"><h2>Workout history</h2>${state.logs.length?state.logs.slice().reverse().map(l=>`<div class="warm"><b>${esc(l.name)}</b> <span class="sub">${new Date(l.date).toLocaleString()}</span><div class="sub">${(l.ex||[]).filter(e=>(e.sets||[]).some(s=>s.done)).map(e=>esc(e.name)).join(' · ')}</div></div>`).join(''):'<p class="muted">Complete your first workout to see your history.</p>'}</div>`;
document.getElementById('settings').innerHTML=`<div class="card"><h2>Settings & backup</h2><p class="sub">Data is saved in this browser on this device. Clearing browser storage may erase it. Export backups regularly; there is no automatic cross-device sync.</p><div class="row"><label>Rest timer</label><select style="width:135px" onchange="state.rest=Number(this.value);save();render()">${[45,60,90,120,180].map(x=>`<option value="${x}" ${state.rest===x?'selected':''}>${x} seconds</option>`).join('')}</select></div><div class="row" style="margin-top:15px"><button class="btn" onclick="exportData()">Export backup</button><label class="btn secondary" style="cursor:pointer">Import backup<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div><button class="btn danger" style="margin-top:16px" onclick="resetAll()">Erase all data</button></div>`;save()}
function recommend(e,last,w){let range=e[2].match(/(\d+)[–-](\d+)/);if(!range)return 'Log your sets to calibrate your next target.';let low=Number(range[1]),high=Number(range[2]);if(!last)return w>0?'Starting estimate: '+w+' lb · '+e[1]+' × '+e[2]+'; adjust to comfortable effort.':'No history yet. Choose a conservative weight for '+e[1]+' × '+e[2]+'.';let done=(last.sets||[]).filter(x=>x.done&&Number(x.r)>0&&Number(x.w)>0);if(!done.length)return 'No completed working sets yet. Start conservatively.';let load=Number(done[0].w),same=done.filter(x=>Math.abs(Number(x.w)-load)<.01);if(same.length>=e[1]&&same.slice(0,e[1]).every(x=>Number(x.r)>=high)){let inc=e[4]==='compound'?5:2.5;return 'Progression candidate: '+(load+inc)+' lb for '+e[1]+' × '+e[2]+' if technique and recovery are good.'}if(done.filter(x=>Number(x.r)<low).length>=2)return 'Previous reps were below target; consider a lighter load or more recovery.';return 'Repeat approximately '+load+' lb; work toward '+high+' controlled reps across sets.';}
function warmHtml(e,w){if(!w||w<=0)return '<div class="sub" style="margin-top:9px">Enter a working weight for suggested warm-ups.</div>';if(e[4]!=='compound')return '<div class="sub" style="margin-top:9px">Isolation: 1–2 light feeler sets as needed.</div>';return `<div class="sub" style="margin-top:9px">Suggested warm-up (adjust for comfort): ${[[.4,10],[.6,6],[.75,3],[.9,1]].map(([pct,r])=>round5(w*pct)+'×'+r).join(' · ')}</div>`}
function weightChange(j,v){let name=PLAN[state.index].ex[j][0];state.weights[name]=Number(v)||0;document.getElementById('warm'+j).innerHTML=warmHtml(PLAN[state.index].ex[j],Number(v));save()}function update(j,z,field,v){getDraft(state.index,j,PLAN[state.index].ex[j][1])[z][field]=v;save()}function addSet(j){getDraft(state.index,j,PLAN[state.index].ex[j][1]).push({w:'',r:'',done:false});save();render()}
function finish(){let p=PLAN[state.index],ex=p.ex.map((e,j)=>({name:e[0],sets:getDraft(state.index,j,e[1]).map(s=>({...s}))}));let count=ex.reduce((n,e)=>n+e.sets.filter(s=>s.done&&Number(s.r)>0).length,0);if(!count){alert('Mark at least one completed set with reps before saving.');return}if(!confirm('Save '+count+' completed sets and advance to the next workout?'))return;state.logs.push({date:new Date().toISOString(),name:p.name,ex});for(let j=0;j<p.ex.length;j++)delete state.draft[key(state.index,j)];state.index=(state.index+1)%PLAN.length;save();render();window.scrollTo(0,0)}
let restInterval=null;function startRest(){if(restInterval)clearInterval(restInterval);let end=Date.now()+state.rest*1000;function tick(){let left=Math.max(0,Math.ceil((end-Date.now())/1000)),el=document.getElementById('timer');if(el)el.textContent=left?left+'s remaining':'Rest complete';if(!left)clearInterval(restInterval)}tick();restInterval=setInterval(tick,250)}
function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='jarvis-fit-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function importData(el){let f=el.files[0];if(!f)return;f.text().then(t=>{try{let v=JSON.parse(t);if(!Array.isArray(v.logs)||!Number.isInteger(v.index)||v.index<0||v.index>5||!v.draft||!v.weights)throw Error();if(confirm('Replace current workout data with this backup?')){state=v;save();render()}}catch{alert('Invalid backup file')}})}function resetAll(){if(confirm('Permanently erase all workout data on this device?')){localStorage.removeItem(KEY);location.reload()}}render();
</script></body></html>
